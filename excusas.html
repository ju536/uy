<div class="container">

    <div class="card">

        <h2>Registrar excusas</h2>

        <form id="formExcusa">

            <select>
                <option>Inasistencia</option>
                <option>Salud</option>
                <option>Uniforme</option>
            </select>

            <input type="text" placeholder="Nombre del acudiente">

            <input type="text" placeholder="Detalle de la Excusa">

            <label>Selecciona una fecha de Registro:</label>
            <input type="date" id="fecha">

            <input type="text" placeholder="Firma digital">

            <input type="file">

            <button type="submit">Enviar</button>

            <div id="mensajeExito" class="mensaje-exito">
                ✅ ¡La excusa se envió correctamente!
            </div>

        </form>

    </div>
