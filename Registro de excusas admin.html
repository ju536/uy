<!DOCTYPE html>
<html lang="es">
<head>

    <style>
        .imagen{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin: 40px auto;
            padding: 20px 0;
        }

        .imagen img{
            max-width: 350px;
            width: 80%;
            height: auto;
            border: none;
        }

    </style>

    <meta charset="UTF-8">

    <title>Registro de Estudiantes</title>

    <link rel="stylesheet" href="style.css">



</head>


<header>

    <div class="logo">
        <img src="Imagenes Project ceb/ciudadela.jpg">
    </div>

<h1>Project CEB</h1>

<div class="top-icons">
    <i class="fa-solid fa-manifying-glass"></i>
    <i class="fa-solid fa-bell"></i>
    <i class="fa-solid fa-user-circle"></i>
</div>

<nav>
    <a href="entrada administrador.html">Entrada Admin</a>
    <a href="configuracion admin.html">Configuración</a>
    <a href="perfil admin.html">Perfil</a>

    <button class="btn-cerrar-sesion" onclick="cerrarSesion()">
    Cerrar sesión
</button>
</nav>

</header>

<div class="card">

    <h2>Registro de Excusas</h2>

    <!-- FILTROS DE EXCUSAS -->

<div class="filtros">

    <!-- TIPO DE EXCUSA -->
    <div class="campo">

        <label for="tipoExcusa">Tipo de excusa:</label>

        <select id="tipoExcusa">

            <option value="">Todas</option>
            <option value="Salud">Salud</option>
            <option value="Uniforme">Uniforme</option>
            <option value="Inasistencia">Inasistencia</option>

        </select>

    </div>


    <!-- FECHA -->
    <div class="campo">

        <label for="fechaExcusa">Fecha:</label>

        <input type="date" id="fechaExcusa">

    </div>


    <!-- NIVEL -->
    <div class="campo">

        <label for="nivel">Nivel:</label>

        <select id="nivel" onchange="cambiarGrados()">

            <option value="">Todos</option>
            <option value="primaria">Primaria</option>
            <option value="bachillerato">Bachillerato</option>

        </select>

    </div>


    <!-- GRADO -->
    <div class="campo">

        <label for="grado">Grado:</label>

        <select id="grado" onchange="cambiarCursos()" disabled>

            <option value="">Todos</option>

        </select>

    </div>


    <!-- CURSO -->
    <div class="campo">

        <label for="curso">Curso:</label>

        <select id="curso" disabled>

            <option value="">Todos</option>

        </select>

    </div>


    <!-- BOTÓN BUSCAR -->
    <button type="button" onclick="filtrarExcusas()">
        Buscar
    </button>

</div>


<!-- TABLA -->

<table id="tablaExcusas">

    <tr>
        <th>ID</th>
        <th>Tipo</th>
        <th>Fecha</th>
        <th>Estudiante</th>
        <th>Curso</th>
        <th>Acudiente</th>
    </tr>


    <!-- ZOE -->

    <tr
        data-nivel="bachillerato"
        data-grado="10"
        data-curso="10-05"
    >

        <td>02</td>
        <td>Salud</td>
        <td>25/08/2026</td>
        <td>Zoe Forero</td>
        <td>10-05</td>
        <td>Paula Forero</td>

    </tr>


    <!-- LAURA -->

    <tr
        data-nivel="bachillerato"
        data-grado="9"
        data-curso="907"
    >

        <td>03</td>
        <td>Uniforme</td>
        <td>15/07/2026</td>
        <td>Laura Rodriguez</td>
        <td>907</td>
        <td>Luis Rodriguez</td>

    </tr>

</table>
</div>

<footer>

    <p>Project CEB 2026</p>
</footer>

<script src="script.js"></script>

</body>    
</html>
