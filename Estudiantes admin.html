    <meta charset="UTF-8">

<header>

    <div class="logo">
        <img src="Imagenes Project ceb/ciudadela.jpg">
    </div>

<h1>Project CEB</h1>

<div class="top-icons">

<nav>

    Cerrar sesión

<div class="card">

   <h2>Registro de Estudiantes</h2>

   
<!-- DOCUMENTO -->
<div class="campo">
    <label for="documento">Documento:</label>

    <input
        type="text"
        id="documento"
        placeholder="Escribir documento de identidad"
    >
</div>


<!-- NOMBRE -->
<div class="campo">
    <label for="nombre">Nombre:</label>

    <input
        type="text"
        id="nombre"
        placeholder="Escribir nombre del estudiante"
    >
</div>


<!-- NIVEL -->
<div class="campo">
    <label for="nivel">Nivel:</label>

    <select id="nivel">
        <option value="">Todos los niveles</option>
        <option value="primaria">Primaria</option>
        <option value="bachillerato">Bachillerato</option>
    </select>
</div>


<!-- GRADO -->
<div class="campo">
    <label for="grado">Grado:</label>

    <select id="grado" disabled>
        <option value="">Todos los grados</option>
    </select>
</div>


<!-- CURSO -->
<div class="campo">
    <label for="curso">Curso:</label>

    <select id="curso" disabled>
        <option value="">Todos los cursos</option>
    </select>
</div>


<button type="button" id="btnBuscar">
    Buscar
</button>

</div>


  <table id="tablaEstudiantes">

    <tr>
        <th>Documento</th>
        <th>Estudiante</th>
        <th>Curso</th>
        <th>Grado</th>
        <th>Nivel</th>
        <th>Tipo de excusa</th>
    </tr>

    <tr
        data-nivel="bachillerato"
        data-grado="10°"
        data-curso="10-05"
        data-tipo="Médica"
    >
        <td>10276428</td>
        <td>Zoe Forero</td>
        <td>1005</td>
        <td>10°</td>
        <td>Bachillerato</td>
        <td>Médica</td>
    </tr>

    <tr
        data-nivel="primaria"
        data-grado="1°"
        data-curso="102"
        data-tipo="Familiar"
    >
        <td>10357888</td>
        <td>Laura Rodriguez</td>
        <td>102</td>
        <td>1°</td>
        <td>Primaria</td>
        <td>Familiar</td>
    </tr>

</table>

</div>

</footer>

</html>
